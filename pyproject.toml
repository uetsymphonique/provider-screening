[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provider-screening"
version = "0.1.0"
requires-python = ">=3.11"
# Runtime dependencies are managed via requirements.txt, not here -- this
# pyproject.toml exists only to make the repo's own modules (shared/,
# scripts/, tools/, the provider-assessment skill's scripts/) importable
# without manual sys.path surgery, via `pip install -e .`.
dependencies = []

[tool.setuptools]
packages = [
    "shared",
    "scripts",
    "scripts.batch",
    "scripts.batch.core",
    "scripts.batch.core.handlers",
    "tools",
    "tools.htmlstage",
    "tools.htmlstage.core",
    "tools.htmlstage.core.fetchers",
    "tools.pdfstage",
    "provider_assessment",
    "provider_assessment.aggregate",
]

[tool.setuptools.package-dir]
provider_assessment = ".claude/skills/provider-assessment/scripts"

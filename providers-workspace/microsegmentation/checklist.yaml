# Canonical Microsegmentation evaluation checklist.
# IDs are stable - never renumber. Add new items with new IDs.
#
# verdict_type semantics:
#   boolean            → supported | partial | not_supported | unknown | not_applicable
#   numeric_threshold  → same verdicts, but items[].numeric_value + unit MUST be present
#                        (validator rejects the assessment otherwise)
#
# threshold.op:  "<" | "<=" | ">" | ">="   (evaluated against numeric_value + unit)
#
# not_applicable_class - classifies the REQUIREMENT SENTENCE, not any vendor
# (see GUIDE.md "Verdicts" rule 7 for the full test). Set once when an item
# is authored/revised; never re-derived per product. Only items that can
# legitimately receive verdict: not_applicable carry this field.
#   mechanism → sentence names a specific component and asks about A
#               PROPERTY OF IT (resource use, failure behavior, install/
#               update behavior, channel encryption). Test: does an
#               instance of that component exist anywhere in the
#               documented architecture, for any purpose?
#               Absent -> not_applicable (no referent to measure).
#               Present -> evaluate the property normally.
#   outcome   → sentence asks whether the product CAN PRODUCE A RESULT,
#               optionally at a stated depth/scope. Test: (1) does the
#               product produce it via ANY means? none + explicit absence
#               -> not_supported (never inferred from silence -> unknown).
#               (2) if produced only at narrower scope, is that scope
#               ruled out BY DEFINITION by the mechanism already used
#               (-> not_applicable), or just not built out yet on the
#               same mechanism (-> partial)?
# na_test_scope (mechanism class only): "broad" = any instance of the
#   component counts, whatever its purpose. "narrow" = only an instance
#   positioned as the sentence requires (e.g. in the traffic path) counts.

meta:
  version: 1
  source: providers-workspace/microsegmentation/checklist.md
  language: vi
  updated: 2026-08-06

categories:
  - id: "1"
    name: "Visibility & Mapping"
  - id: "2"
    name: "Policy Management"
  - id: "3"
    name: "Architecture & Support"
  - id: "4"
    name: "Performance & Impact"
  - id: "5"
    name: "Integration & Automation"
  - id: "6"
    name: "Security & Compliance"
  - id: "7"
    name: "High Availability"
  - id: "8"
    name: "Standards Certification"

items:
  # 1. Visibility & Mapping
  - id: "1.1"
    category: "1"
    requirement: "Tự động khám phá luồng dữ liệu thời gian thực (Real-time Auto-discovery)."
    verdict_type: boolean

  - id: "1.2"
    category: "1"
    requirement: "Hiển thị sơ đồ kết nối trực quan theo App, Environment, Role, Process."
    verdict_type: boolean

  - id: "1.3"
    category: "1"
    requirement: "Lưu trữ lịch sử luồng kết nối ít nhất 90 ngày để truy vết forensic."
    verdict_type: numeric_threshold
    threshold: { op: ">=", value: 90, unit: "days" }

  - id: "1.4"
    category: "1"
    requirement: "Hiển thị lỗ hổng phần mềm (Vulnerability/CVE Context) trực tiếp trên map."
    verdict_type: boolean

  - id: "1.5"
    category: "1"
    requirement: "Phát hiện các luồng kết nối ẩn, luồng không tiêu chuẩn (Unrecognized Traffic)."
    verdict_type: boolean

  # 2. Policy Management
  - id: "2.1"
    category: "2"
    requirement: "Tạo chính sách dựa trên Tag/Label/Identity (không phụ thuộc IP/VLAN)."
    verdict_type: boolean

  - id: "2.2"
    category: "2"
    requirement: "Hỗ trợ gợi ý chính sách tự động bằng AI/Machine Learning (Rule Recommendation)."
    verdict_type: boolean

  - id: "2.3"
    category: "2"
    requirement: "Chế độ Mô phỏng / Giả lập Chính sách (Policy Simulation / Dry-run)."
    verdict_type: boolean

  - id: "2.4"
    category: "2"
    requirement: "Khả năng khôi phục chính sách tức thì (Instant 1-Click Rollback)."
    verdict_type: boolean

  - id: "2.5"
    category: "2"
    requirement: "Hỗ trợ chính sách phân cấp (Inherited & Hierarchical Rules)."
    verdict_type: boolean

  # 3. Architecture & Support
  - id: "3.1"
    category: "3"
    requirement: "Hỗ trợ đa dạng OS: Windows Server (2003-2022), Linux RHEL/CentOS/Ubuntu, AIX, Solaris."
    verdict_type: boolean
    not_applicable_class: mechanism
    na_test_scope: broad

  - id: "3.2"
    category: "3"
    requirement: "Hỗ trợ Container / Kubernetes / OpenShift native isolation."
    verdict_type: boolean
    not_applicable_class: outcome

  - id: "3.3"
    category: "3"
    requirement: "Hỗ trợ cả giải pháp Agent-based và Agentless/Network Integration."
    verdict_type: boolean

  - id: "3.4"
    category: "3"
    requirement: "Tương thích môi trường cách ly hoàn toàn không có Internet (Air-gapped Network)."
    verdict_type: boolean

  - id: "3.5"
    category: "3"
    requirement: "Khả năng mở rộng (Scalability) lên tới trên 50,000 Workloads tập trung."
    verdict_type: numeric_threshold
    threshold: { op: ">=", value: 50000, unit: "workloads" }

  # 4. Performance & Impact
  - id: "4.1"
    category: "4"
    requirement: "Mức độ tiêu tốn tài nguyên Agent: CPU < 1%."
    verdict_type: numeric_threshold
    threshold: { op: "<", value: 1, unit: "cpu_percent" }
    not_applicable_class: mechanism
    na_test_scope: broad

  - id: "4.2"
    category: "4"
    requirement: "Mức độ tiêu tốn tài nguyên Agent: RAM < 100MB."
    verdict_type: numeric_threshold
    threshold: { op: "<", value: 100, unit: "MB" }
    not_applicable_class: mechanism
    na_test_scope: broad

  - id: "4.3"
    category: "4"
    requirement: "Không làm tăng độ trễ mạng (< 0.1ms network latency)."
    verdict_type: numeric_threshold
    threshold: { op: "<", value: 0.1, unit: "ms" }
    not_applicable_class: mechanism
    na_test_scope: narrow

  - id: "4.4"
    category: "4"
    requirement: "Agent Fail-safe: Nếu Agent lỗi hoặc crash, giao tiếp mạng giữ nguyên không bị gián đoạn."
    verdict_type: boolean
    not_applicable_class: mechanism
    na_test_scope: narrow

  - id: "4.5"
    category: "4"
    requirement: "Cài đặt và cập nhật Agent không yêu cầu Reboot Server."
    verdict_type: boolean
    not_applicable_class: mechanism
    na_test_scope: broad

  # 5. Integration & Automation
  - id: "5.1"
    category: "5"
    requirement: "Full RESTful API hỗ trợ 100% chức năng quản trị."
    verdict_type: boolean

  - id: "5.2"
    category: "5"
    requirement: "Tích hợp sẵn với SIEM/SOAR (Splunk, QRadar, Sentinel) qua Syslog/CEF/API."
    verdict_type: boolean

  - id: "5.3"
    category: "5"
    requirement: "Tích hợp CMDB (ServiceNow) để đồng bộ hóa thông tin nhãn (Tags)."
    verdict_type: boolean

  - id: "5.4"
    category: "5"
    requirement: "Tích hợp CI/CD Pipeline (Jenkins, GitLab, Terraform) cho DevSecOps."
    verdict_type: boolean

  # 6. Security & Compliance
  - id: "6.1"
    category: "6"
    requirement: "Kiểm soát truy cập sâu tới cấp độ Tiến trình (Process-level enforcement)."
    verdict_type: boolean
    not_applicable_class: outcome

  - id: "6.2"
    category: "6"
    requirement: "Tích hợp Threat Intelligence & Đánh lừa (Honeypot/Deception detection)."
    verdict_type: boolean

  - id: "6.3"
    category: "6"
    requirement: "Báo cáo tuân thủ có sẵn theo chuẩn: PCI-DSS, NIST 800-207, ISO 27001, IEC 62443."
    verdict_type: boolean

  - id: "6.4"
    category: "6"
    requirement: "Mã hóa dữ liệu truyền giữa Agent và Controller (TLS 1.3 / Mutual Auth)."
    verdict_type: boolean
    not_applicable_class: mechanism
    na_test_scope: broad

  # 7. High Availability
  - id: "7.1"
    category: "7"
    requirement: "Kiến trúc Cụm Controller hỗ trợ High Availability (Active-Active / Active-Passive)."
    verdict_type: boolean

  - id: "7.2"
    category: "7"
    requirement: "Nếu Controller mất kết nối hoàn toàn, Agent trên Host vẫn tiếp tục thực thi Policy (Autonomous Mode)."
    verdict_type: boolean
    not_applicable_class: mechanism
    na_test_scope: narrow

  - id: "7.3"
    category: "7"
    requirement: "Hỗ trợ sao lưu và khôi phục thảm họa (Disaster Recovery site sync)."
    verdict_type: boolean

  # 8. Standards Certification
  - id: "8.1"
    category: "8"
    requirement: "Đạt chứng nhận an ninh quốc tế: FIPS 140-2/140-3, Common Criteria EAL4+."
    verdict_type: boolean

  - id: "8.2"
    category: "8"
    requirement: "Chứng nhận tương thích phần mềm công nghiệp từ Siemens, Honeywell, ABB (cho OT)."
    verdict_type: boolean
